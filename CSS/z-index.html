<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid black;
        }

        .black-box {
            position: relative;
            z-index: 1;
            border: 2px solid black;
            background-color: black;
            color: white;
            text-align: center;
            height: 100px;
            margin: 30px;
        }

        .gray-box {
            position: absolute;
            z-index: 3;
            border: 2px solid lightgray;
            background-color: lightgray;
            height: 100px;
            width: 70%;
            left: 50px;
            right: 50px;
            bottom: 100px;
            top: -39px;
        }

        .green-box{
            position: absolute;
            z-index: 2;
            border: 2px solid lightgreen;
            background-color: lightgreen;
            height: 100px;
            width: 35%;
            left: 270px;
            top: -15px;
        }
        </style>
</head>
<body>
    <div class="container">
    <div class="black-box">Black box</div>
    <div class="gray-box">Gray box</div>
    <div class="green-box">Green box</div>
    </div>
</body>
</html>
