<!DOCTYPE html>
<html lang="en">
    <style>
    .container{
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 10px;
        background-color: #e7ed9a;
        padding: 10px; 
        border: 3px solid black;   
    }
    .container  div{
        background-color: rgba(255, 255, 255, 0.8);
        text-align: center;
        padding: 20px 0;
        font-size: 18px;
        border: 2px solid rgb(4, 136, 79);
    }
    .header{
        grid-column-start: 1 ;
        grid-column-end: 13;
    }
    .sidebar {
         grid-row-start:2;
         grid-row-end: 12;
    }
    .conatiner{
        grid-column-start: 2;
        grid-column-end: 12;
        grid-row-start: 2;
        grid-row-end: 12;
    }
    .Ads{
        grid-row-start: 2;
        grid-row-end: 7;
    }
    .Sidebar{
        grid-row-start: 7;
        grid-row-end: 12;
    }

        grid-column-start: 1 ;
        grid-column-end: 13;
    }
    </style>
