<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lightgoldenrodyellow;
        }

        /* laptop  */
        @media(min-width: 1024px) and (max-width: 1200px) {
            body {
                background-color: lightgreen;
                font-size: 20px;
                font-style: italic;
            }

            h1 {
                font-style: italic;
                color: red;
            }
        }

        /* Tablet */
        @media(max-width: 768px) {
            body {
                background-color: lightblue;
                font-size: 18px;
                font-style: italic;
            }

            h1 {
                font-style: italic;
                color: red;
            }
        }

        /* Mobile */
        @media(max-width: 480px) {
            body {
                background-color: black;
                font-size: 16px;
                font-style: italic;
                color: white;
            }

            h1 {
                font-style: italic;
                color: yellow;
            }
        }
    </style>
</head>

<body>
    <h1> the media query</h1>
    <p>Resize the browser window to see the effect.</p>
    <p>The media query will change the background color of this paragraph when the screen size is 500px or less.</p>
    <p>it change color with respect to the size of webpage </p>
</body>

</html>
